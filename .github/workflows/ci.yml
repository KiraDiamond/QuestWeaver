name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --fetch-retries=1 --fetch-timeout=30000
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json --fetch-retries=0 --fetch-timeout=20000 > audit-report.json
          audit_status=$?
          set -e
          cat audit-report.json
          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('audit-report.json', 'utf8'));
          if (report.error) {
            console.log('::warning::npm advisory service unavailable; audit could not be refreshed');
            process.exit(0);
          }
          const vulnerabilities = report.metadata?.vulnerabilities;
          if (!vulnerabilities) {
            console.error('npm audit returned an unrecognized report');
            process.exit(1);
          }
          const blocking = (vulnerabilities.high ?? 0) + (vulnerabilities.critical ?? 0);
          process.exit(blocking > 0 ? 1 : 0);
          EOF
